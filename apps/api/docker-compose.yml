services:
  postgress:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/docker/postgresql/data
    networks:
      - task-manager

volumes:
  postgres_data:

networks:
  nestjs-course:
